exclude:
  - _db
  - _plugins
  - .gitignore
include:
  - suppliers.json
  - collections.json
collections:
  posts:
    output: false
  shippers:
    # Each row carries its own per-row permalink, generated in SQL.
    output: true
  shipper_pages:
    # Common permalink template; SQL provides path/name/title used by placeholders.
    output: true
    permalink: /:path/:name-:title:output_ext
sqlite:
  - data: orders
    file: &db "_db/northwind.db"
    query: SELECT * from Orders
  - data: customers
    file: *db
    query: SELECT * from Customers
  - data: categories
    file: *db
    query: SELECT CategoryID, CategoryName, Description FROM Categories
  - data: categories.products
    file: *db
    query: SELECT ProductID, ProductName,CategoryID FROM Products WHERE Products.CategoryID=:CategoryID
  # site.data.FeaturedProducts is a list created via _data/FeaturedProducts.yml
  # This can re-use the data from the file to query the database
  - data: FeaturedProducts.details
    file: *db
    query: SELECT ProductID, ProductName, UnitPrice FROM Products WHERE ProductID = :FP_ID
  # We can also use single value from site.data.SpeedyExpress to get the ID for the query
  - data: DelayedOrders
    file: *db
    query: SELECT OrderID from Orders WHERE ShipVia = :SpeedyExpress

  - data: regions
    file: *db
    query: SELECT RegionID, RegionDescription FROM Regions ORDER BY RegionID
  
  - data: regions.territories
    file: *db
    query: |
      SELECT TerritoryID, TerritoryDescription FROM Territories 
      WHERE RegionID = :RegionID
      ORDER BY TerritoryDescription
  
  - data: regions.territories.EmployeeIDs
    file: *db
    query: |
      SELECT T.EmployeeID as EmployeeID, FirstName,LastName FROM EmployeeTerritories T,Employees
      WHERE T.TerritoryID = :TerritoryID
      AND T.EmployeeID = Employees.EmployeeID

  # Collections: write query results into Jekyll collections
  # instead of site.data. site.posts is special (built-in collection).
  - collection: posts
    file: *db
    query: |
      SELECT 'Order ' || OrderID AS title,
             OrderDate AS date,
             OrderID, CustomerID, ShipName
      FROM Orders ORDER BY OrderID LIMIT 5
  - collection: shippers
    file: *db
    query: |
      SELECT ShipperID, CompanyName, Phone, Content AS content,
             '/shippers/' || ShipperID || '.html' AS permalink
      FROM Shippers ORDER BY ShipperID

  # Common permalink template `/:path/:name-:title:output_ext` defined on the
  # collection. SQL produces the columns those placeholders read from.
  - collection: shipper_pages
    file: *db
    query: |
      SELECT ShipperID,
             'companies'             AS path,
             'shipper-' || ShipperID AS name,
             CompanyName             AS title,
             Content                 AS content
      FROM Shippers ORDER BY ShipperID
