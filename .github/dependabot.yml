version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    directory: "test"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "bundler"
    directory: "docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
